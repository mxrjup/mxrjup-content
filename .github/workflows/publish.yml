name: Publish content

# Puts this repository live. The host's checkout of it is the server's CONTENT_DIR,
# and the server rereads data/*.json on every request and serves uploads/ straight
# from disk, so publishing is a pull: no build, no restart, no tag.
#
# Runs on every push to main (a CMS save, a hand edit), when another workflow of this
# repository calls it after pushing (the Spotify timeline sync), and by hand from the
# Actions tab. A caller in this repository uses:
#
#   jobs:
#     publish:
#       needs: <the job that pushed to main>
#       uses: ./.github/workflows/publish.yml
#       secrets: inherit
on:
  push:
    branches:
      - main
  workflow_call:
    secrets:
      INFOMANIAK_HOST:
        required: true
      INFOMANIAK_USER:
        required: true
      INFOMANIAK_SSH_PASSWORD:
        required: true
      INFOMANIAK_CONTENT_PATH:
        required: true
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # A CMS save and the Spotify sync can land together, and two pulls at once would
    # trip over git's lock. Every pull takes all of main, so a queued run replaced by
    # a newer one loses nothing.
    concurrency:
      group: publish-content
      cancel-in-progress: false
    steps:
      - name: Pull into CONTENT_DIR via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          # Infomaniak's Node.js sites accept no SSH key: log in with the SSH user's password.
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          # Infomaniak's SSH hands a command run without a terminal no working
          # stderr: the first write to it (git fetch's progress) killed the deploy
          # with SIGPIPE (exit 141) before any output. Ask for a terminal, and send
          # stderr to stdout anyway so nothing depends on that second stream.
          request_pty: true
          script: |
            set -e
            exec 2>&1
            # The host's checkout of this repository, cloned over HTTPS: the
            # repository is public, so the host needs no key to pull it.
            cd "${{ secrets.INFOMANIAK_CONTENT_PATH }}"

            # Nothing on the host writes here - the server only reads content - so a
            # change git sees was made by hand and exists nowhere else. Stop rather
            # than let a pull overwrite it or publish around it.
            changes="$(git status --porcelain)"
            if [ -n "$changes" ]; then
              echo "::error::The content checkout in $PWD has local changes; nothing was published."
              echo "$changes"
              echo "Commit them to the repository or discard them on the host, then run this again."
              exit 1
            fi

            branch="$(git symbolic-ref --quiet --short HEAD || true)"
            if [ "$branch" != main ]; then
              echo "::error::The content checkout in $PWD is not on main (${branch:-detached HEAD})."
              exit 1
            fi

            # Fast-forward only. If the host has commits that main does not - main
            # was rewritten, or someone committed on the host - stop instead of
            # merging, and the site keeps serving what it had.
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "::error::The content checkout in $PWD has diverged from origin/main; nothing was published."
              echo "Compare on the host: git log --oneline --graph HEAD origin/main"
              exit 1
            fi
            git pull --ff-only origin main
            echo "Published $(git rev-parse --short HEAD)."
